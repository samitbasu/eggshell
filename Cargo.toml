[package]
name = "eggshell-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "taffy lays out, egui draws and interacts"
repository = "https://github.com/samitbasu/eggshell"

[dependencies]
taffy = "0.15.1"
egui = "0.37"
web-time = "1.1"

[features]
# Golden-image tests: kittest renders them with wgpu, so they need a Vulkan
# driver. `cargo xtask snapshots` selects a software one.
snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

[dev-dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
egui_kittest = "0.37"
trybuild = "1"
eggshell-ui-shadcn = { path = "crates/eggshell-ui-shadcn" }

# proptest's rng wants a getrandom backend that the browser build does not
# select, and the fuzzers only run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.12.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[workspace]
members = ["crates/eggshell-ui-shadcn", "xtask"]
