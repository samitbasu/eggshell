[package]
name = "eggshell-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "taffy lays out, egui draws and interacts"
repository = "https://github.com/samitbasu/eggshell"

[dependencies]
taffy = "0.15.1"
egui = "0.37"
log = "0.4"
nohash-hasher = "0.2"
web-time = "1.1"

[features]
default = ["clipboard"]
# The system clipboard, read on demand through `Shell::read_clipboard`.
# Without it, or on wasm, a read answers `ClipboardError::Unavailable`.
clipboard = ["dep:arboard"]
# Golden-image tests: kittest renders them with wgpu, so they need a Vulkan
# driver. `cargo xtask snapshots` selects a software one.
snapshots = ["egui_kittest/snapshot", "egui_kittest/wgpu"]

# The version egui-winit asks for, so the tree has the one arboard.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", optional = true, default-features = false, features = ["image-data", "wayland-data-control"] }

[dev-dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
egui_kittest = "0.37"
trybuild = "1"
eggshell-ui-shadcn = { path = "crates/eggshell-ui-shadcn" }

# proptest's rng wants a getrandom backend that the browser build does not
# select, and the fuzzers only run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.12.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "frame"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[workspace]
members = ["crates/eggshell-ui-shadcn", "xtask"]

# `cargo xtask fuzz`: the sessions run about six times faster than in dev, and
# the workspace rebuilds in seconds where release takes minutes.
[profile.fuzz]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
