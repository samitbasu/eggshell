[package]
name = "eggshell-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "taffy lays out, egui draws and interacts"
repository = "https://github.com/samitbasu/eggshell"

[dependencies]
taffy = "0.15.1"
egui = "0.37"
# Icons and SVG images, rasterised by resvg at the size they are drawn.
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
nohash-hasher = "0.2"
web-time = "1.1"
log = "0.4"
egui_kittest = { version = "0.37", optional = true }
pulldown-cmark = { version = "0.13.6", default-features = false, optional = true }
unicode-normalization = { version = "0.1.25", optional = true }

[features]
default = [
    "clipboard",
    "fonts",
    # keep sorted
    "accordion",
    "alert",
    "badge",
    "dialog",
    "disclosure",
    "skeleton",
    "spinner",
    "tabs",
]
# The system clipboard, read on demand through `Shell::read_clipboard`.
# Without it, or on wasm, a read answers `ClipboardError::Unavailable`.
clipboard = ["dep:arboard"]
# Bundles Geist (SIL OFL 1.1, src/fonts/OFL.txt), 165 KiB, as the tokens' font.
fonts = []
# `testing::Driver`: drives a view through kittest's harness in tests. Enable
# it in a dev-dependency.
driver = ["dep:egui_kittest"]
# `testing::screenshot`: renders a harness to PNGs on Mesa lavapipe. Linux
# only for now (#337); elsewhere enabling it is a compile error.
screenshots = ["dep:egui_kittest", "egui_kittest/wgpu", "dep:egui-wgpu", "dep:pollster", "dep:image"]
# Golden-image tests: kittest renders them on the screenshot path, so they need
# Mesa lavapipe. `cargo xtask snapshots` selects it.
snapshots = ["screenshots", "egui_kittest/snapshot"]
# The widgets beyond core's controls, each its own feature.
# keep sorted
accordion = ["disclosure"]
alert = []
badge = []
command = ["dep:unicode-normalization"]
dialog = []
disclosure = []
form = []
hover-card = []
markdown = ["dep:pulldown-cmark"]
navigation-menu = []
notify = []
skeleton = []
spinner = []
tabs = []

# The version egui-winit asks for, so the tree has the one arboard.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6", optional = true, default-features = false, features = ["image-data", "wayland-data-control"] }

# The web build's key listener (`web::prevent_claimed_chords`), its
# window-focus check (`web::PageFocus`) and its keyboard reveal and page
# background (`web::reveal_text_input`, `web::paint_page_background`);
# eframe's web runner already brings both crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "MutationObserver", "MutationObserverInit", "Node", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "VisualViewport", "Window"] }

[target.'cfg(target_os = "linux")'.dependencies]
egui-wgpu = { version = "0.37", optional = true, default-features = false }
pollster = { version = "1.0", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }

[dev-dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
eframe = "0.37"
egui_kittest = "0.37"
trybuild = "1"
# eggshell's own tests drive views through `testing::Driver`.
eggshell-ui = { path = ".", features = [
    "driver",
    # keep sorted
    "accordion",
    "alert",
    "badge",
    "command",
    "dialog",
    "disclosure",
    "form",
    "hover-card",
    "markdown",
    "navigation-menu",
    "notify",
    "skeleton",
    "spinner",
    "tabs",
] }

# proptest's rng wants a getrandom backend that the browser build does not
# select, and the fuzzers only run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.12.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "frame"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"

[workspace]
members = ["xtask"]

# clippy.toml's disallowed macros and methods are denied in library code by
# each library's crate attributes; tests, examples and benches may use them.
[workspace.lints.clippy]
disallowed_macros = "allow"
disallowed_methods = "allow"

[lints]
workspace = true

# `cargo xtask fuzz`: the sessions run about six times faster than in dev, and
# the workspace rebuilds in seconds where release takes minutes.
[profile.fuzz]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

# `cargo xtask ci`'s release step: the dev build without debug assertions, so
# the checks gated on them are proven off as in release, without release's
# rebuild time (#336).
[profile.release-gates]
inherits = "dev"
debug-assertions = false
overflow-checks = false
