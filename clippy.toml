max-fn-params-bools = 1

disallowed-macros = [
    { path = "std::assert", reason = "a failed assertion panics: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
    { path = "std::assert_eq", reason = "a failed assertion panics: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
    { path = "std::assert_ne", reason = "a failed assertion panics: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
    { path = "std::debug_assert", reason = "a failed assertion panics in debug builds: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
    { path = "std::debug_assert_eq", reason = "a failed assertion panics in debug builds: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
    { path = "std::debug_assert_ne", reason = "a failed assertion panics in debug builds: report misuse with `report`, or an invariant as `Problem::Internal`, and fall back" },
]
disallowed-methods = [
    { path = "f32::clamp", reason = "panics on reversed or NaN bounds: use `finite::clamp`" },
    { path = "f64::clamp", reason = "panics on reversed or NaN bounds: use `finite::clamp`" },
    { path = "core::cmp::Ord::clamp", reason = "panics on reversed bounds: use `finite::clamp`" },
    { path = "core::time::Duration::from_secs_f32", reason = "panics on a negative, NaN or overflowing value: use `Duration::try_from_secs_f32`" },
    { path = "core::time::Duration::from_secs_f64", reason = "panics on a negative, NaN or overflowing value: use `Duration::try_from_secs_f64`" },
    { path = "core::time::Duration::mul_f32", reason = "panics on a negative, NaN or overflowing result: use `Duration::try_from_secs_f32` on the product" },
    { path = "core::time::Duration::mul_f64", reason = "panics on a negative, NaN or overflowing result: use `Duration::try_from_secs_f64` on the product" },
    { path = "core::time::Duration::div_f32", reason = "panics on a negative, NaN or overflowing result: use `Duration::try_from_secs_f32` on the quotient" },
    { path = "core::time::Duration::div_f64", reason = "panics on a negative, NaN or overflowing result: use `Duration::try_from_secs_f64` on the quotient" },
    { path = "egui::accesskit::Node::set_controls", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_controlled", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_details", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_detail", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_described_by", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_described_by", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_flow_to", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_flow_to", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_labelled_by", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_labelled_by", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_owns", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_owned", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_radio_group", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::push_to_radio_group", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_active_descendant", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_error_message", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_in_page_link_target", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_member_of", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_next_on_line", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_previous_on_line", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "egui::accesskit::Node::set_popup_for", reason = "the adapters panic on a relation to a node not in the tree: note a `relation::Relation`" },
    { path = "std::sync::Mutex::lock", reason = "use `sync::lock`, which takes the guard back from a poisoned lock" },
]
