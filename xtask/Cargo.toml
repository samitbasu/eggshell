[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
duct = "1.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
