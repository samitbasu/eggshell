[package]
name = "eggshell-examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "The eggshell examples as a library: what their mains, the tests and the docs share"
publish = false

[dependencies]
eggshell-ui = { path = ".." }
