[package]
name = "eggshell-ui-shadcn"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "The shadcn/ui design system as a eggshell style"
repository = "https://github.com/samitbasu/eggshell"

[features]
default = ["fonts"]
# Bundles Geist (SIL OFL 1.1, fonts/OFL.txt), 165 KiB, as the preset's font.
fonts = []
# Fills the looks of eggshell-ui-extras' widgets from the preset's tokens.
extras = [
    "dep:eggshell-ui-extras",
    # keep sorted
    "eggshell-ui-extras/accordion",
    "eggshell-ui-extras/badge",
    "eggshell-ui-extras/command",
    "eggshell-ui-extras/dialog",
    "eggshell-ui-extras/disclosure",
    "eggshell-ui-extras/form",
    "eggshell-ui-extras/hover-card",
    "eggshell-ui-extras/markdown",
    "eggshell-ui-extras/notify",
    "eggshell-ui-extras/skeleton",
]

[dependencies]
eggshell-ui = { path = "../..", version = "0.1.0" }
egui = "0.37"
eggshell-ui-extras = { path = "../eggshell-ui-extras", version = "0.1.0", optional = true }

[lints]
workspace = true

[[example]]
name = "preset_dump"
required-features = ["extras"]
