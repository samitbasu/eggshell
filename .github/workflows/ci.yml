name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Test binaries statically link egui; full debuginfo made them hundreds of MB
  # each and filled the runner's disk. Line tables keep file:line in panics.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # The test build carries the golden feature; bump this when the
          # features it builds with change, or the old cache is restored whole
          # and never saved again.
          key: workspace-goldens-screenshots-clippy-release
      - name: Mesa lavapipe for the golden images and screenshots
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # The generated shadcn sheets are checked against shadcn's registry at
      # the commit in xtask/shadcn.pin, beside the checkout as ../ref/shadcn.
      - name: shadcn pin
        id: shadcn
        run: echo "sha=$(cat xtask/shadcn.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: shadcn-cache
        with:
          path: ${{ github.workspace }}/../ref/shadcn
          key: shadcn-registry-${{ steps.shadcn.outputs.sha }}
      - name: shadcn registry at the pin
        if: steps.shadcn-cache.outputs.cache-hit != 'true'
        run: |
          git init -q ../ref/shadcn
          cd ../ref/shadcn
          git remote add origin https://github.com/shadcn-ui/ui
          git sparse-checkout set apps/v4/registry
          git fetch -q --depth 1 --filter=blob:none origin "${{ steps.shadcn.outputs.sha }}"
          git checkout -q FETCH_HEAD
      # The fuzz step runs in the `fuzz` job, beside this one.
      - run: cargo xtask ci --skip fuzz
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh target

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask fuzz

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo xtask coverage --lcov
      - name: Disk usage
        if: always()
        run: |
          df -h
          du -sh target
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
